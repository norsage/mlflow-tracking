[project]
name = "mlflow-tracking-skill"
version = "0.0.0"
description = "Development environment for the mlflow-tracking skill: tests only, not a package"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mlflow-skinny>=3",
    "mlflow[auth]>=3",
    "hydra-core>=1.3",
    "hydra-joblib-launcher>=1.2",
    "pytest>=8",
]
lightning = [
    "lightning>=2.4",
    "torch>=2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
# the templates' package; a project's copies import its own package here
known-first-party = ["__pkg__"]

[tool.pyright]
pythonVersion = "3.11"
include = ["templates", "scripts"]
extraPaths = ["templates", "scripts"]
